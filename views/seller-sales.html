<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>OSCO — Продавцы</title>
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/warehouse.css" />
</head>
<body>
<div class="nav">
<a class="nav-link" href="/admin">📦 Заказы</a>
<a class="nav-link" href="/admin/clients">👥 Клиенты</a>
<a class="nav-link" href="/admin/history">📜 История действий</a>
<a class="nav-link" href="/admin/warehouse">📦 Склад</a>
<a class="nav-link" href="/admin/reports">📊 Отчёты</a>
<a class="nav-link" href="/admin/employees">👷 Сотрудники</a>
<a class="nav-link" href="/admin/stock-movements">🔄 Движение товара</a>
<a class="nav-link" href="/admin/order-lookup">🔎 Проверка заказа</a>
<a class="nav-link active" href="/admin/seller-sales">🛒 Продавцы</a>
<a class="nav-link logout-link" href="/logout">Выйти</a>
</div>

<div class="warehouse-container">
<main class="warehouse-content" style="width:100%;">
<h1>🛒 Продажи продавцов</h1>
<p style="color:#8a8f98;margin-top:-10px;">Все продажи, оформленные сотрудниками через /sell — объединено по всем сразу</p>

<div class="warehouse-toolbar">
<select id="employeeFilter" class="warehouse-select">
<option value="">Все продавцы</option>
</select>
<input type="date" id="fromDate" class="warehouse-search" style="max-width:160px;">
<input type="date" id="toDate" class="warehouse-search" style="max-width:160px;">
<button class="btn" id="applyFilterBtn">Применить</button>
</div>

<div class="stats-row" id="statsRow" style="margin-bottom:20px;"></div>

<div class="table-card">
<h2>Продажи</h2>
<table class="warehouse-table">
<thead>
<tr>
<th>Дата</th>
<th>Продавец</th>
<th>Товары</th>
<th>Код заказа</th>
<th>Сумма</th>
</tr>
</thead>
<tbody id="salesBody">
<tr><td colspan="5"><div class="empty-state">Загрузка...</div></td></tr>
</tbody>
</table>
</div>

</main>
</div>

<script src="/seller-sales.js"></script>
</body>
</html>
