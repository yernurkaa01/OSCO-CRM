<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>OSCO — Продавцы</title>
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/warehouse.css" />
</head>
<body>
<div class="nav">
  <a class="nav-link" href="/admin">📦 Заказы</a>
  <a class="nav-link" href="/admin/clients">👥 Клиенты</a>
  <a class="nav-link" href="/admin/history">📜 История действий</a>
  <a class="nav-link" href="/admin/warehouse">📦 Склад</a>
  <a class="nav-link" href="/admin/reports">📊 Отчёты</a>
  <a class="nav-link" href="/admin/employees">👷 Сотрудники</a>
  <a class="nav-link" href="/admin/stock-movements">🔄 Движение товара</a>
  <a class="nav-link active" href="/admin/seller-sales">🧑‍💼 Продавцы</a>
  <a class="nav-link logout-link" href="/logout">Выйти</a>
</div>

<div class="warehouse-container" style="display:block;">
<main class="warehouse-content" style="width:100%;">

  <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px;">
    <div>
      <h1 style="margin-bottom:2px;">🧑‍💼 Продавцы</h1>
      <p style="color:#8a8f98; margin:0;">Список всех продавцов и их показатели</p>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <input type="text" id="orderSearch" class="warehouse-search" style="min-width:280px;" placeholder="Поиск по товару или коду заказа...">
      <button class="btn btn-primary" id="addSellerBtn">+ Добавить продавца</button>
    </div>
  </div>

  <div id="orderSearchResults" style="display:none; margin-bottom:20px;"></div>

  <div id="sellersGrid" class="stats-row" style="grid-template-columns: repeat(3, 1fr);">
    <div class="empty-state">Загрузка...</div>
  </div>

  <div class="table-card" style="padding:18px 22px; display:flex; gap:32px; flex-wrap:wrap;">
    <div>
      <div class="stat-label">Всего продавцов</div>
      <div class="stat-value" id="sumTotalSellers">—</div>
      <div class="stat-sub" id="sumActiveSellers"></div>
    </div>
    <div>
      <div class="stat-label">Всего заказов</div>
      <div class="stat-value" id="sumTotalOrders">—</div>
      <div class="stat-sub" id="sumOrdersToday"></div>
    </div>
    <div>
      <div class="stat-label">Общая выручка</div>
      <div class="stat-value" id="sumTotalRevenue">—</div>
      <div class="stat-sub" id="sumRevenueToday"></div>
    </div>
    <div>
      <div class="stat-label">Общая прибыль</div>
      <div class="stat-value" id="sumTotalProfit">—</div>
      <div class="stat-sub" id="sumProfitToday"></div>
    </div>
  </div>

</main>
</div>

<script src="/seller-sales.js"></script>
</body>
</html>
