<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>OSCO — Склад</title>
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/warehouse.css" />
</head>
<body>
<div class="nav">
<a class="nav-link" href="/admin">📦 Заказы</a>
<a class="nav-link" href="/admin/clients">👥 Клиенты</a>
<a class="nav-link" href="/admin/history">📜 История действий</a>
<a class="nav-link active" href="/admin/warehouse">📦 Склад</a>
<a class="nav-link" href="/admin/reports">📊 Отчёты</a>
<a class="nav-link logout-link" href="/logout">Выйти</a>
</div>

<div class="warehouse-container">
<!-- Левый сайдбар -->
<aside class="warehouse-sidebar">
<h3>Категории</h3>
<ul class="category-list" id="categoryList">
<!-- заполняется через warehouse.js -->
</ul>
<button class="manage-categories-btn">⚙️ Управление категориями</button>
</aside>

<!-- Правый контент -->
<main class="warehouse-content">
<h1>📦 Склад</h1>

<div class="warehouse-toolbar">
<input
id="warehouseSearch"
class="warehouse-search"
type="text"
placeholder="Поиск товара по названию, артикулу, штрихкоду…"
/>
<select id="categorySelect" class="warehouse-select">
<option value="all">Все категории</option>
</select>
<button class="btn">📊 Экспорт в Excel</button>
<button class="btn btn-primary" id="addProductBtn">+ Добавить товар</button>
</div>

<div class="stats-row" id="statsRow">
<!-- карточки статистики — заполняются через warehouse.js -->
</div>

<div class="table-card">
<h2 id="tableCount">Товары</h2>
<table class="warehouse-table">
<thead>
<tr>
<th>Код</th>
<th>Наименование</th>
<th>Категория</th>
<th>Количество</th>
<th>Ед. изм.</th>
<th>Цена</th>
<th>Сумма</th>
<th>Статус</th>
<th>Действия</th>
</tr>
</thead>
<tbody id="tableBody">
<!-- строки — заполняются через warehouse.js -->
</tbody>
</table>

<div class="table-footer">
<span id="footerInfo">Показано 0 из 0</span>
<div class="pagination" id="pagination"></div>
<div class="legend">
<span><span class="status-dot ok"></span> Достаточно</span>
<span><span class="status-dot low"></span> Мало (≤ 50)</span>
<span><span class="status-dot out"></span> Нет в наличии</span>
</div>
<span id="updatedAt"></span>
</div>
</div>
</main>
</div>

<script src="/warehouse.js"></script>
</body>
</html>
