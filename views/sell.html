<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>OSCO — Продажа</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    margin: 0;
    background: #f6f7fb;
    color: #1a1a1a;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 10px 0 16px; }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 1px 3px rgba(20,20,43,0.08);
    margin-bottom: 14px;
  }
  input, select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #e3e6ec;
    font-size: 16px;
    margin-bottom: 10px;
  }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #2551d9;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .product-item {
    padding: 10px;
    border-bottom: 1px solid #f2f2f2;
    cursor: pointer;
  }
  .product-item:active { background: #f6f7fb; }
  .cart-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #f2f2f2;
    font-size: 14px;
  }
  .cart-row button {
    width: auto;
    padding: 4px 10px;
    background: #fdeaea;
    color: #c0392b;
    font-size: 13px;
  }
  .total { font-size: 18px; font-weight: 700; text-align: right; margin: 10px 0; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; }
  .logout-btn { width: auto; background: none; color: #8a8f98; font-size: 13px; padding: 6px; }
  .error { color: #c0392b; font-size: 14px; margin-top: 6px; }
  .success { color: #1a9d52; font-size: 16px; text-align: center; padding: 20px; }
  #qtyRow { display: none; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #e3e6ec;
    background: #fff;
    color: #333;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab-btn.active { background: #2551d9; color: #fff; border-color: #2551d9; }
  .history-order {
    border-bottom: 1px solid #f2f2f2;
    padding: 10px 0;
    font-size: 13px;
  }
  .history-order .items { color: #555; margin: 4px 0; }
  .history-order .meta { display: flex; justify-content: space-between; color: #8a8f98; font-size: 12px; }
</style>
</head>
<body>

<div class="wrap">

  <div id="loginScreen" style="display:none;">
    <h1>Вход</h1>
    <div class="card">
      <input type="text" id="loginUsername" placeholder="Логин">
      <input type="password" id="loginPassword" placeholder="Пароль">
      <button id="loginBtn">Войти</button>
      <div class="error" id="loginError"></div>
    </div>
  </div>

  <div id="saleScreen" style="display:none;">
    <div class="top-bar">
      <h1 id="greeting"></h1>
      <button class="logout-btn" id="logoutBtn">Выйти</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabSaleBtn">Новая продажа</button>
      <button class="tab-btn" id="tabHistoryBtn">Мои продажи</button>
    </div>

    <div id="saleTab">
      <div class="card">
        <input type="text" id="productSearch" placeholder="Поиск товара по названию/коду">
        <div id="productResults"></div>
      </div>

      <div id="qtyRow" class="card">
        <div id="selectedProductLabel" style="font-weight:600; margin-bottom:8px;"></div>
        <input type="number" id="qtyInput" min="1" value="1" placeholder="Количество">
        <button id="addToCartBtn">Добавить в продажу</button>
      </div>

      <div class="card" id="cartCard" style="display:none;">
        <div id="cartList"></div>
        <div class="total" id="cartTotal"></div>
        <button id="submitSaleBtn">✅ Оформить продажу</button>
      </div>

      <div id="saleResult"></div>
    </div>

    <div id="historyTab" style="display:none;">
      <div class="card" id="historyList">Загрузка...</div>
    </div>
  </div>

</div>

<script src="/sell.js"></script>
</body>
</html>
