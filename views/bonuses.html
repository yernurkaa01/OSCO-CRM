<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>OSCO — Бонусы</title>
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/warehouse.css" />
</head>
<body>
<div class="nav">
<a class="nav-link" href="/admin">📦 Заказы</a>
<a class="nav-link" href="/admin/clients">👥 Клиенты</a>
<a class="nav-link" href="/admin/history">📜 История действий</a>
<a class="nav-link" href="/admin/warehouse">📦 Склад</a>
<a class="nav-link" href="/admin/reports">📊 Отчёты</a>
<a class="nav-link" href="/admin/employees">👷 Сотрудники</a>
<a class="nav-link" href="/admin/stock-movements">🔄 Движение товара</a>
<a class="nav-link active" href="/admin/bonuses">💰 Бонусы</a>
<a class="nav-link logout-link" href="/logout">Выйти</a>
</div>

<div class="warehouse-container">
<main class="warehouse-content" style="width:100%;">
<h1>💰 Бонусы сотрудников</h1>
<p style="color:#8a8f98;margin-top:-10px;">Процент от личных продаж через мобильный интерфейс, фиксируется помесячно</p>

<div class="warehouse-toolbar">
<input type="month" id="monthInput" class="warehouse-search" style="max-width:200px;">
<button class="btn btn-primary" id="calculateBtn">Рассчитать за месяц</button>
</div>

<div class="table-card">
<h2>История начислений</h2>
<table class="warehouse-table">
<thead>
<tr>
<th>Месяц</th>
<th>Сотрудник</th>
<th>Продано лично</th>
<th>Процент</th>
<th>Бонус</th>
<th>Статус</th>
<th>Действия</th>
</tr>
</thead>
<tbody id="bonusesBody">
<tr><td colspan="7"><div class="empty-state">Загрузка...</div></td></tr>
</tbody>
</table>
</div>

</main>
</div>

<script src="/bonuses.js"></script>
</body>
</html>
